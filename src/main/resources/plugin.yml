name: UniversalWeapons
version: 1.0.0
main: com.chargingofficial.universalweapons.UniversalWeapons
api-version: '1.21.11'
description: Custom weapons and abilities, including Corrupted Calamity.
commands:
  weapon:
    description: Gives you a custom weapon or Eclipse Core.
    usage: /weapon [calamity|crossbow|spear|trident|axe|slimeball] [normal]
    permission: universalweapons.weapon
  stuck:
    description: Restores gravity and clears movement if an ability leaves you stuck.
    usage: /stuck
permissions:
  universalweapons.weapon:
    description: Allows the player to receive Corrupted Calamity.
    default: op
